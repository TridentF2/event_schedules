name: Publish event schedules
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 02 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/configure-pages@v6
      - name: Expire old schedules
        run: python expire_schedules.py
      - name: Keep only the current deployment state
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "F2 Schedule Builder"
            git config user.email "actions@users.noreply.github.com"
            git add events.json site
            git commit --amend --no-edit
            git push --force-with-lease
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
