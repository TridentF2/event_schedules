name: Expire event schedules
on:
  schedule:
    - cron: "17 02 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  expire:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Expire old schedules
        run: python expire_schedules.py
      - name: Keep only the current deployment state
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "F2 Schedule Builder"
            git config user.email "actions@users.noreply.github.com"
            git add events.json site
            git commit --amend --no-edit
            git push --force-with-lease
          fi
